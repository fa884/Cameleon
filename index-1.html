<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cameleon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1f4f7;--card:#fff;--ink:#12202f;--mute:#5b6b7a;--line:#d8e0e8;--teal:#0b7a75;--soft:#ddf1ef;--sun:#e9a100;--red:#b3261e;
 --h:"Bricolage Grotesque",system-ui,sans-serif;--b:Figtree,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0e1721;--card:#152230;--ink:#e8eef4;--mute:#93a4b4;--line:#243445;--teal:#3cc2b9;--soft:#14363a;--sun:#f2b632;--red:#ff8a80}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--b);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,h3,.brand{font-family:var(--h);margin:0}h2{font-size:20px;margin:22px 0 10px}h3{font-size:17px}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;max-width:820px;margin:0 auto}
.brand{font-size:26px;font-weight:700;letter-spacing:-.5px}
.brand::after{content:"";display:block;height:4px;border-radius:2px;margin-top:2px;background:linear-gradient(90deg,var(--teal),var(--sun),var(--red));animation:shift 6s ease-in-out infinite alternate;background-size:200% 100%}
@keyframes shift{to{background-position:100% 0}}
@media(prefers-reduced-motion:reduce){.brand::after{animation:none}}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 16px}
nav button{background:none;color:var(--mute);border-radius:0;padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--teal);font-weight:600}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;background:var(--teal);color:#fff;cursor:pointer;min-height:44px}
:root:not(.x) button.alt{background:var(--soft);color:var(--teal)}
button.bad{background:none;color:var(--red);border:1px solid var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:4px 0 12px;min-height:44px}
label{font-weight:500;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.mute{color:var(--mute);font-size:14px}.err{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.num{font:700 24px var(--h);color:var(--teal)}
.rail{display:flex;gap:4px;margin:10px 0}.rail i{flex:1;height:6px;border-radius:3px;background:var(--line)}.rail i.f{background:var(--teal)}
.rail.x i{background:var(--red);opacity:.35}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--teal);font-weight:600}.tag.r{background:none;border:1px solid var(--red);color:var(--red)}
.auth{max-width:440px;margin:0 auto;padding:36px 16px}.auth .brand{font-size:38px}.lead{color:var(--mute);margin:14px 0 22px}
.tabs2{display:flex;gap:6px;margin-bottom:16px}.tabs2 button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}.tabs2 button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
details summary{cursor:pointer;font-weight:600;color:var(--teal);padding:8px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:8px;display:none;max-width:90vw;z-index:9}
#toast.bad{background:var(--red);color:#fff}
</style></head>
<body><div id="app"></div><div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.min.js"></script>
<script>
const app=document.getElementById('app'),RATE=.4;
let sb,me=null,tab='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F=n=>Number(n||0).toLocaleString('fr-FR')+' FCFA';
const L={nouvelle:'Nouvelle',preparee:'Préparée',en_livraison:'En livraison',livree:'Livrée',echouee:'Échec de livraison',annulee:'Annulée'};
const STEPS=['nouvelle','preparee','en_livraison','livree'];
const ROLES={grossiste:'Grossiste',freelance:'Freelance',livreur:'Livreur',admin:'Administrateur'};
const TABS={grossiste:['Produits','Commandes','Gains'],freelance:['Offres','Mes ventes','Gains'],livreur:['À prendre','Mes livraisons'],admin:['Résumé','Comptes','Commandes']};
function toast(m,bad){const t=document.getElementById('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
async function run(fn,ok){try{const r=await fn();if(r&&r.error)throw r.error;if(ok)toast(ok);return r||{}}catch(e){toast(e.message||'Une erreur est survenue',true);return null}}
const view=h=>{document.getElementById('view').innerHTML=h};

/* ---------- Connexion ---------- */
function authView(mode='login'){
 const tabs=`<div class="tabs2"><button class="${mode=='login'?'on':''}" onclick="authView('login')">Connexion</button><button class="${mode=='signup'?'on':''}" onclick="authView('signup')">Inscription</button></div>`;
 const f={login:`<form onsubmit="doLogin(event)"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label><button style="width:100%">Se connecter</button><p><a href="#" onclick="authView('forgot');return false">Mot de passe oublié ?</a></p></form>`,
 signup:`<form onsubmit="doSignup(event)"><label>Nom complet<input name="name" required autocomplete="name"></label><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Téléphone<input name="phone" type="tel" autocomplete="tel"></label><label>Je m'inscris comme<select name="role"><option value="freelance">Freelance (je trouve des clients)</option><option value="grossiste">Grossiste (j'ai des produits)</option></select></label><label>Mot de passe (8 caractères minimum)<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button style="width:100%">Créer mon compte</button><p class="mute">Ton compte sera activé après validation par l'administrateur.</p></form>`,
 forgot:`<form onsubmit="doForgot(event)"><label>E-mail du compte<input name="email" type="email" required></label><button style="width:100%">Envoyer le lien</button><p><a href="#" onclick="authView('login');return false">Retour</a></p></form>`}[mode];
 app.innerHTML=`<main class="auth"><div class="brand">Cameleon</div><p class="lead">Les grossistes ont le stock, les freelances ont les clients. Chaque commande est suivie jusqu'à la livraison, et chaque commission est calculée pour toi.</p>${mode=='forgot'?'':tabs}${f}</main>`}
async function doLogin(e){e.preventDefault();const d=new FormData(e.target);
 const r=await run(()=>sb.auth.signInWithPassword({email:d.get('email').trim(),password:d.get('password')}));if(r)enter(r.data.session)}
async function doSignup(e){e.preventDefault();const d=new FormData(e.target);
 const r=await run(()=>sb.auth.signUp({email:d.get('email').trim(),password:d.get('password'),options:{data:{full_name:d.get('name').trim(),phone:d.get('phone').trim(),role:d.get('role')}}}));
 if(!r)return;if(r.data.session)return enter(r.data.session);
 app.innerHTML=`<main class="auth"><div class="brand">Cameleon</div><h2>Vérifie ta boîte mail</h2><p class="lead">Clique sur le lien de confirmation envoyé à ton adresse, puis connecte-toi. L'administrateur validera ensuite ton compte.</p><button onclick="authView('login')">Aller à la connexion</button></main>`}
async function doForgot(e){e.preventDefault();const d=new FormData(e.target);
 const r=await run(()=>sb.auth.resetPasswordForEmail(d.get('email').trim(),{redirectTo:location.origin+location.pathname}),'Lien envoyé : vérifie ta boîte mail');if(r)authView('login')}
function recoveryView(){app.innerHTML=`<main class="auth"><div class="brand">Cameleon</div><h2>Nouveau mot de passe</h2><form onsubmit="doNewPass(event)"><label>Nouveau mot de passe (8 caractères minimum)<input name="p" type="password" minlength="8" required></label><button style="width:100%">Enregistrer</button></form></main>`}
async function doNewPass(e){e.preventDefault();const p=new FormData(e.target).get('p');
 const r=await run(()=>sb.auth.updateUser({password:p}),'Mot de passe changé');if(r){history.replaceState(null,'',location.pathname);const {data}=await sb.auth.getSession();enter(data.session)}}
const logout=()=>sb.auth.signOut();

/* ---------- Entrée dans l'application ---------- */
async function enter(session){
 if(!session)return authView();
 const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error||!data){authView();return toast('Profil introuvable',true)}
 me=data;
 if(me.status!=='active'){
  const m=me.status=='pending'?"Ton compte est en attente de validation par l'administrateur. Reviens plus tard ou actualise.":"Ton compte est suspendu. Contacte l'administrateur de Cameleon.";
  app.innerHTML=`<main class="auth"><div class="brand">Cameleon</div><h2>Bonjour ${esc(me.full_name)}</h2><p class="lead">${m}</p><div class="row"><button onclick="boot()">Actualiser</button><button class="alt" onclick="logout()">Se déconnecter</button></div></main>`;return}
 tab=TABS[me.role][0];shell()}
function shell(){
 app.innerHTML=`<header><div><div class="brand">Cameleon</div></div><div class="row"><span class="mute">${esc(me.full_name)} · ${ROLES[me.role]}</span><button class="alt" onclick="logout()">Quitter</button></div></header><div class="wrap"><nav id="nav"></nav><div id="view"></div></div>`;
 nav();show()}
function nav(){document.getElementById('nav').innerHTML=TABS[me.role].map(t=>`<button class="${t==tab?'on':''}" onclick="go('${t}')">${t}</button>`).join('')}
function go(t){tab=t;nav();show()}

/* ---------- Données ---------- */
async function orders(){const {data,error}=await sb.from('orders').select('*,products(name)').order('id',{ascending:false});if(error){toast(error.message,true);return[]}return data}
function rail(o){if(o.status=='echouee'||o.status=='annulee')return `<div class="rail x"><i></i><i></i><i></i><i></i></div>`;
 const k=STEPS.indexOf(o.status);return `<div class="rail">${STEPS.map((s,i)=>`<i class="${i<=k?'f':''}"></i>`).join('')}</div>`}
function btns(o){const r=me.role,s=o.status,a=[];
 if(r=='grossiste'&&s=='nouvelle')a.push(['preparee','Marquer préparée']);
 if(r=='livreur'&&s=='preparee')a.push(['en_livraison','Prendre en charge']);
 if(r=='livreur'&&s=='en_livraison')a.push(['livree','Livrée'],['echouee','Échec',1]);
 if(r=='admin'&&s=='en_livraison')a.push(['echouee','Marquer en échec',1]);
 if((r=='grossiste'&&['nouvelle','preparee'].includes(s))||(r=='freelance'&&s=='nouvelle')||(r=='admin'&&['nouvelle','preparee','en_livraison'].includes(s)))a.push(['annulee','Annuler',1]);
 let h=a.map(([st,t,bad])=>`<button class="${bad?'bad':''}" onclick="act(${o.id},'${st}')">${t}</button>`).join('');
 if(r=='admin'&&s=='livree')h+=`<button class="alt" onclick="pay(${o.id},${!o.commission_paid})">${o.commission_paid?'Commission réglée (annuler)':'Marquer la commission réglée'}</button>`;
 return h}
function card(o){const total=o.quantity*o.unit_price,bad=['echouee','annulee'].includes(o.status);
 let money=`Total client ${F(total)}`;
 if(me.role=='grossiste')money=`À recevoir ${F(o.quantity*o.wholesale_price)}`;
 if(me.role=='freelance'||me.role=='admin')money+=` · Commission ${F(o.commission_amount)}${o.status=='livree'?(o.commission_paid?' (réglée)':' (à régler)'):''}`;
 return `<div class="card"><div class="row"><h3 class="grow">Commande ${o.id} : ${esc(o.products?.name||'Produit')} × ${o.quantity}</h3><span class="tag ${bad?'r':''}">${L[o.status]}</span></div>${rail(o)}
 <div class="mute">${esc(o.client_name)} · ${esc(o.client_phone)}<br>${esc(o.client_address)}<br>${money}</div><div class="row" style="margin-top:10px">${btns(o)}</div></div>`}
async function act(id,s){if(s=='annulee'&&!confirm('Annuler cette commande ?'))return;
 if(await run(()=>sb.rpc('set_order_status',{p_order:id,p_status:s}),'Statut mis à jour'))show()}
async function pay(id,v){if(await run(()=>sb.rpc('mark_commission_paid',{p_order:id,p_paid:v}),'Commission mise à jour'))show()}

/* ---------- Écrans ---------- */
async function show(){view('<p class="mute">Chargement…</p>');const r=me.role,t=tab;
 if(r=='grossiste'){
  if(t=='Produits')return prodOwn();
  if(t=='Commandes'){const o=await orders();return view(o.length?o.map(card).join(''):'<p class="mute">Aucune commande pour le moment. Elles apparaîtront ici dès qu\'un freelance vendra tes produits.</p>')}
  return gains(await orders(),'g')}
 if(r=='freelance'){
  if(t=='Offres')return offers();
  if(t=='Mes ventes'){const o=await orders();return view(o.length?o.map(card).join(''):'<p class="mute">Tu n\'as pas encore de vente. Choisis un produit dans Offres.</p>')}
  return gains(await orders(),'f')}
 if(r=='livreur'){const o=await orders(),mine=t=='Mes livraisons';
  const l=o.filter(x=>mine?x.courier_id==me.id:x.status=='preparee');
  return view(l.length?l.map(card).join(''):`<p class="mute">${mine?'Aucune livraison en cours.':'Aucune commande prête à livrer.'}</p>`)}
 if(t=='Résumé')return summary();
 if(t=='Comptes')return accounts();
 const o=await orders();view(o.length?o.map(card).join(''):'<p class="mute">Aucune commande.</p>')}

async function prodOwn(){const {data,error}=await sb.from('products').select('*').eq('owner_id',me.id).order('created_at',{ascending:false});
 if(error)return toast(error.message,true);
 view(`<div class="card"><h3>Ajouter un produit</h3><form onsubmit="addProd(event)"><label>Nom<input name="n" required></label><label>Description<input name="d"></label><div class="grid"><label>Ton prix (FCFA)<input name="w" type="number" min="1" required></label><label>Prix de vente client (FCFA)<input name="s" type="number" min="1" required></label></div><button>Ajouter le produit</button></form></div>`+
 (data.length?data.map(p=>`<div class="card"><div class="row"><h3 class="grow">${esc(p.name)}</h3><span class="tag ${p.active?'':'r'}">${p.active?'Visible':'Masqué'}</span></div><div class="mute">${esc(p.description)}<br>Ton prix ${F(p.wholesale_price)} · Vente ${F(p.sale_price)}</div><div class="row" style="margin-top:10px"><button class="alt" onclick="toggleProd('${p.id}',${!p.active})">${p.active?'Masquer':'Rendre visible'}</button></div></div>`).join(''):'<p class="mute">Ajoute ton premier produit pour que les freelances puissent le vendre.</p>'))}
async function addProd(e){e.preventDefault();const d=new FormData(e.target),w=+d.get('w'),s=+d.get('s');
 if(s<=w)return toast('Le prix de vente doit être supérieur à ton prix',true);
 if(await run(()=>sb.from('products').insert({owner_id:me.id,name:d.get('n').trim(),description:d.get('d').trim(),wholesale_price:w,sale_price:s}),'Produit ajouté'))show()}
async function toggleProd(id,v){if(await run(()=>sb.from('products').update({active:v}).eq('id',id)))show()}

async function offers(){const {data,error}=await sb.from('products').select('*').eq('active',true).order('created_at',{ascending:false});
 if(error)return toast(error.message,true);
 view(data.length?data.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><div class="mute">${esc(p.description)}<br>Prix client ${F(p.sale_price)} · Ta commission estimée ${F((p.sale_price-p.wholesale_price)*RATE)} par unité</div>
 <details><summary>Enregistrer une vente</summary><form onsubmit="sell(event,'${p.id}')"><label>Quantité<input name="q" type="number" min="1" value="1" required></label><label>Nom du client<input name="n" required></label><label>Téléphone du client<input name="t" type="tel" required></label><label>Adresse de livraison<input name="a" required></label><button>Envoyer la commande</button></form></details></div>`).join(''):'<p class="mute">Aucun produit disponible pour le moment.</p>')}
async function sell(e,pid){e.preventDefault();const d=new FormData(e.target);
 const r=await run(()=>sb.rpc('create_order',{p_product:pid,p_qty:+d.get('q'),p_name:d.get('n'),p_phone:d.get('t'),p_address:d.get('a')}),'Commande enregistrée');if(r)go('Mes ventes')}

function gains(o,w){const done=o.filter(x=>x.status=='livree'),run_=o.filter(x=>['nouvelle','preparee','en_livraison'].includes(x.status));
 const sum=f=>done.reduce((s,x)=>s+f(x),0);
 const cards=w=='g'?`<div class="card"><div class="num">${F(sum(x=>x.quantity*x.wholesale_price))}</div><span class="mute">Montant acquis (commandes livrées)</span></div>`:
 `<div class="card"><div class="num">${F(sum(x=>x.commission_amount))}</div><span class="mute">Commissions acquises</span></div><div class="card"><div class="num">${F(done.filter(x=>x.commission_paid).reduce((s,x)=>s+x.commission_amount,0))}</div><span class="mute">Déjà réglées</span></div>`;
 view(`<div class="grid">${cards}<div class="card"><div class="num">${run_.length}</div><span class="mute">Commandes en cours (pas encore comptées)</span></div></div><p class="mute">Seules les commandes livrées comptent. Une commande annulée ou en échec ne rapporte rien.</p>`)}

async function summary(){const [o,p]=await Promise.all([orders(),sb.from('profiles').select('role,status')]);
 const pr=p.data||[],done=o.filter(x=>x.status=='livree'),by=s=>o.filter(x=>x.status==s).length;
 const due=done.filter(x=>!x.commission_paid).reduce((s,x)=>s+x.commission_amount,0);
 const c=(n,l)=>`<div class="card"><div class="num">${n}</div><span class="mute">${l}</span></div>`;
 view(`<div class="grid">${c(o.length,'Commandes')}${c(done.length,'Livrées')}${c(by('echouee')+by('annulee'),'Échecs et annulations')}${c(F(done.reduce((s,x)=>s+x.quantity*x.unit_price,0)),'Ventes livrées')}${c(F(due),'Commissions à régler')}${c(pr.filter(x=>x.status=='pending').length,'Inscriptions en attente')}${c(pr.filter(x=>x.role=='grossiste'&&x.status=='active').length,'Grossistes actifs')}${c(pr.filter(x=>x.role=='freelance'&&x.status=='active').length,'Freelances actifs')}</div>`)}

async function accounts(){const {data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});if(error)return toast(error.message,true);
 const st={pending:'En attente',active:'Actif',suspended:'Suspendu'};
 view(data.map(u=>`<div class="card"><div class="row"><h3 class="grow">${esc(u.full_name)}</h3><span class="tag ${u.status=='active'?'':'r'}">${st[u.status]}</span></div><div class="mute">${esc(u.email)} · ${esc(u.phone||'pas de téléphone')}</div>
 ${u.id==me.id?'<p class="mute">Ton compte</p>':`<div class="row" style="margin-top:10px"><select style="width:auto;margin:0" onchange="setRole('${u.id}',this.value)">${Object.keys(ROLES).map(k=>`<option value="${k}" ${k==u.role?'selected':''}>${ROLES[k]}</option>`).join('')}</select>
 ${u.status!='active'?`<button onclick="setStatus('${u.id}','active')">${u.status=='pending'?'Valider':'Réactiver'}</button>`:''}${u.status!='suspended'?`<button class="bad" onclick="setStatus('${u.id}','suspended')">Suspendre</button>`:''}</div>`}</div>`).join(''))}
async function setStatus(id,s){if(s=='suspended'&&!confirm('Suspendre ce compte ?'))return;if(await run(()=>sb.from('profiles').update({status:s}).eq('id',id),'Compte mis à jour'))show()}
async function setRole(id,r){if(await run(()=>sb.from('profiles').update({role:r}).eq('id',id),'Rôle modifié'))show()}

/* ---------- Démarrage ---------- */
async function boot(){
 if(location.hash.includes('type=recovery'))return;
 const {data:{session}}=await sb.auth.getSession();enter(session)}
(function(){
 if(!window.CAMELEON||CAMELEON.url.includes('VOTRE')){app.innerHTML='<main class="auth"><div class="brand">Cameleon</div><h2>Configuration manquante</h2><p class="lead">Ouvre config.js et colle l\'URL et la clé anon de ton projet Supabase.</p></main>';return}
 sb=supabase.createClient(CAMELEON.url,CAMELEON.key);
 sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY')recoveryView();if(ev=='SIGNED_OUT'){me=null;authView()}});
 boot()})();
</script></body></html>
